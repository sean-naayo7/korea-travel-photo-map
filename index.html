<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>여행 지도 사진 보관함 업데이트</title>
<style>
body{font-family:system-ui,"Noto Sans KR",sans-serif;background:#f7f7f4;color:#24342e;max-width:620px;margin:40px auto;padding:20px}
main{background:white;border:1px solid #dfe3df;border-radius:20px;padding:24px}
button{background:#547c68;color:white;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700}
p{line-height:1.6;color:#68736d}
</style><main>
<h2>사진 보관함 기능 추가</h2>
<p>버튼을 누르면 현재 GitHub의 index.html을 가져와 기존 지도·저장 구조를 유지한 채 별도 사진 업로드 공간을 추가하고, 교체용 index.html을 내려받습니다.</p>
<button id="go">교체용 index.html 만들기</button><p id="status"></p>
</main><script>
const status=document.getElementById('status');
document.getElementById('go').onclick=async()=>{
 try{
 status.textContent='기존 파일을 불러오는 중…';
 const url='https://raw.githubusercontent.com/sean-naayo7/korea-travel-photo-map/main/index.html';
 const res=await fetch(url,{cache:'no-store'});
 if(!res.ok)throw Error('GitHub에서 파일을 가져오지 못했습니다: '+res.status);
 let c=await res.text();
 const old='<section class="panel"><div class="head"><span id="mapTitle">대한민국 시·군 지도</span>';
 const added='<section class="panel" id="photoLibrary"><div class="head"><span>사진 보관함</span><span class="hint">여러 장 한 번에 등록</span></div><label for="libraryPhotos">사진 선택</label><input type="file" id="libraryPhotos" accept="image/*" multiple><div class="preview" id="libraryPreview"></div><label for="libraryRegion">방문 지역</label><select id="libraryRegion" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff"><option value="">지역을 선택하세요</option></select><label for="libraryDate">방문 날짜</label><input type="date" id="libraryDate"><label for="libraryMemo">메모 (선택)</label><textarea id="libraryMemo" placeholder="여행 메모를 남겨보세요."></textarea><div class="row" style="margin-top:14px"><button class="btn primary" type="button" id="librarySave">사진 저장하기</button></div><p class="hint">저장한 사진은 선택한 지역과 연결되고, 지도에도 방문 표시됩니다.</p></section><section class="panel"><div class="head"><span id="mapTitle">대한민국 시·군 지도</span>';
 if(!c.includes(old))throw Error('현재 index.html의 구조가 예상과 달라 자동 교체를 중단했습니다. 기존 파일은 변경하지 않았습니다.');
 c=c.replace(old,added).replace('<span>내 여행 사진</span>','<span>등록된 여행 사진</span>');
 c=c.replace('let db,regions=[],allFeatures=[],currentProvince=null,records={},selected=null,staged=[];','let db,regions=[],allFeatures=[],currentProvince=null,records={},selected=null,staged=[],libraryFiles=[];');
 c=c.replace('<label>사진 추가 (여러 장 가능)</label><input type="file" id="photos" accept="image/*" multiple><div class="preview" id="preview"></div>','');
 c=c.replace('$("photos").value="";staged=[];drawPreview(r.photos||[]);','');
 const handler='$("photos").onchange=e=>[...e.target.files].forEach(file=>{const rd=new FileReader();rd.onload=()=>{staged.push(rd.result);drawPreview([...(records[selected.key]?.photos||[]),...staged])};rd.readAsDataURL(file)});';
 c=c.replace(handler,'').replace('photos:[...(old.photos||[]),...staged]','photos:[...(old.photos||[])]');
 const manager=`function populateLibraryRegions(){const sel=$("libraryRegion");if(!sel)return;const keep=sel.value;sel.innerHTML='<option value="">지역을 선택하세요</option>';regions.slice().sort((a,b)=>a.name.localeCompare(b.name,"ko")).forEach(r=>{const o=document.createElement("option");o.value=r.key;o.textContent=r.name;sel.append(o)});if(keep&&regions.some(r=>r.key===keep))sel.value=keep}
$("libraryPhotos").onchange=e=>{libraryFiles=[...e.target.files];$("libraryPreview").innerHTML="";libraryFiles.forEach(file=>{const box=document.createElement("div");box.className="photo";const img=document.createElement("img");img.src=URL.createObjectURL(file);box.append(img);$("libraryPreview").append(box)})};
$("librarySave").onclick=async()=>{const key=$("libraryRegion").value;if(!key){alert("방문 지역을 선택해 주세요.");return}if(!libraryFiles.length){alert("사진을 먼저 선택해 주세요.");return}const region=regions.find(r=>r.key===key);if(!region)return;try{const urls=await Promise.all(libraryFiles.map(file=>new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(rd.error);rd.readAsDataURL(file)})));const old=records[key]||{};records[key]={name:region.name,date:$("libraryDate").value||old.date||"",memo:$("libraryMemo").value||old.memo||"",photos:[...(old.photos||[]),...urls]};await persist();libraryFiles=[];$("libraryPhotos").value="";$("libraryPreview").innerHTML="";$("libraryRegion").value="";$("libraryMemo").value="";refresh();alert("사진을 저장했어요. 지도에 방문 지역으로 표시됩니다.")}catch(err){alert("사진 저장에 실패했어요. 사진 용량을 확인해 주세요.");console.error(err)}};
`;
 if(!c.includes('function refresh(){'))throw Error('기존 저장 기능을 찾지 못해 중단했습니다.');
 c=c.replace('function refresh(){',manager+'function refresh(){');
 c=c.replace('regions=makeRegions(allFeatures);const svg=$("map")','regions=makeRegions(allFeatures);populateLibraryRegions();const svg=$("map")');
 if(!c.includes('id="photoLibrary"')||!c.includes('korea-travel-photo-map-v1'))throw Error('최종 검증에 실패했습니다.');
 const blob=new Blob([c],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
 status.textContent='완료! index.html이 다운로드되었습니다. 이 파일을 GitHub 저장소의 기존 index.html과 교체하세요.';
 }catch(e){status.textContent='오류: '+e.message;}
};
</script></html>
